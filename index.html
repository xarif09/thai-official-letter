<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบจัดหน้าหนังสือราชการ</title>
<style>
:root{--ui:"Segoe UI","Leelawadee UI",Tahoma,sans-serif;--accent:#1f5fbf}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ui);background:#e9edf2;color:#1d2530}
#app{display:flex;height:100vh}
#side{width:440px;min-width:380px;background:#fff;border-right:1px solid #cfd6df;display:flex;flex-direction:column}
#side header{padding:12px 14px;border-bottom:1px solid #e1e6ec}
#side h1{font-size:17px;margin:0 0 8px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{border:1px solid #c5cfdb;background:#f5f7fa;border-radius:6px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#form{flex:1;overflow:auto;padding:10px 14px 30px}
.f{margin:0 0 9px}
.f label{display:block;font-size:12.5px;font-weight:600;color:#3a4656;margin-bottom:3px}
.f small{font-weight:400;color:#6b7684}
.f input[type=text],.f input[type=date],.f select,.f textarea{width:100%;font:inherit;font-size:14px;padding:6px 8px;border:1px solid #c5cfdb;border-radius:6px;background:#fff}
.f textarea{resize:vertical;min-height:54px}
.f textarea.big{min-height:180px}
.row{display:flex;gap:8px}.row>.f{flex:1}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0}
.sec{font-size:12px;font-weight:700;color:var(--accent);text-transform:none;margin:14px 0 6px;border-top:1px dashed #d6dde6;padding-top:8px}
#actions{padding:10px 14px;border-top:1px solid #e1e6ec;display:flex;flex-wrap:wrap;gap:6px}
#actions button{font:inherit;font-size:13.5px;padding:7px 11px;border-radius:6px;border:1px solid #c5cfdb;background:#fff;cursor:pointer}
#actions button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
#msg{font-size:12.5px;color:#a33;padding:0 14px 8px;min-height:6px}
#main{flex:1;overflow:auto;padding:18px}
#bar{display:flex;gap:14px;align-items:center;font-size:13px;margin-bottom:10px;flex-wrap:wrap}
#warn{color:#b00;font-size:13px}
.vsw{display:inline-flex;border:1px solid #1f5fbf;border-radius:7px;overflow:hidden}
.vsw button{font:inherit;font-size:13px;padding:5px 11px;border:0;background:#fff;color:#1f5fbf;cursor:pointer}
.vsw button.on{background:#1f5fbf;color:#fff}
.vsw button:disabled{color:#aab;cursor:not-allowed}
#stage{position:relative}
.page{position:relative;width:210mm;min-height:297mm;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);transform-origin:top left}
.content{position:absolute;left:30mm;top:25mm;width:160mm}
.doc{font-family:var(--docfont);font-size:16pt;line-height:var(--lh,1.1);color:#000}
.doc p{margin:0;white-space:pre-wrap;word-break:normal;line-break:auto}
.doc p.dist{text-align:justify;text-justify:inter-character}
.fl{position:absolute;white-space:pre;line-height:normal;font-family:var(--docfont)}
.guide{position:absolute;pointer-events:none}
.page.multi{background:transparent;box-shadow:none}
.sheet{position:absolute;left:0;width:210mm;height:297mm;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.pgno{position:absolute;left:0;width:210mm;text-align:center;font-size:16pt;line-height:1}
.pb{position:absolute;left:0;right:0;border-top:2px dashed #e33;pointer-events:none}
.pb span{position:absolute;right:4px;top:-18px;font:12px var(--ui);color:#e33;background:#fff}
#print{display:none}
@media print{
  #app{display:none}
  #print{display:flow-root;position:relative}
  body{background:#fff}
}
#spell{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;z-index:50}
#spell .box{background:#fff;width:min(760px,94vw);max-height:86vh;border-radius:10px;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#spell .hd{padding:12px 16px;border-bottom:1px solid #e1e6ec;display:flex;justify-content:space-between;align-items:center}
#spell .bd{padding:10px 16px;overflow:auto;font-size:14px}
#spell .it{border:1px solid #e1e6ec;border-radius:7px;padding:7px 9px;margin-bottom:7px}
#spell .it .w{color:#c22;text-decoration:line-through} #spell .it .r{color:#18794e;font-weight:bold}
#spell .it .ctx{color:#59636e;font-size:13px;margin-top:3px} #spell .it .lv{font-size:11px;border-radius:4px;padding:1px 6px;margin-left:6px}
#spell .err{background:#fde8e8;color:#b42318} #spell .sug{background:#fff4d6;color:#8a5a00}
#spell button{font:inherit;font-size:13px;padding:3px 10px;border:1px solid #c5cfdb;border-radius:6px;background:#fff;cursor:pointer}
#spell button.pri{background:#1f5fbf;color:#fff;border-color:#1f5fbf}
</style>
<style id="pagecss"></style>
</head>
<body>
<div id="app">
 <div id="side">
  <header>
   <h1>ระบบจัดหน้าหนังสือราชการ</h1>
   <div class="tabs" id="tabs"></div>
  </header>
  <div id="form"></div>
  <div id="msg"></div>
  <div id="actions">
   <button class="pri" id="bDocx">ดาวน์โหลด Word (.docx)</button>
   <button id="bBoth">Word ทั้ง 2 ฉบับ</button>
   <button class="pri" id="bPrint">พิมพ์ / บันทึก PDF</button>
   <button id="bSpell">ตรวจคำผิด</button>
   <button id="bSample">ใส่ข้อมูลตัวอย่าง</button>
   <button id="bTypo">ตัวอย่างที่มีคำผิด</button>
   <button id="bClear">ล้างข้อมูล</button>
  </div>
 </div>
 <div id="main">
  <div id="bar">
   <span class="vsw"><button id="vReal" class="on">ฉบับจริง (ส่งออก)</button><button id="vCopy">สำเนาคู่ฉบับ (เก็บต้นเรื่อง)</button></span>
   <label class="chk"><input type="checkbox" id="gOn" checked> แสดงเส้นแนวตรวจ</label>
   <label class="chk">ย่อ/ขยาย <input type="range" id="zoom" min="40" max="120" value="75"></label>
   <span id="fontinfo"></span>
   <span id="warn"></span>
  </div>
  <div id="stage"><div class="page" id="page"></div></div>
 </div>
</div>
<div id="print"></div>
<div id="spell"><div class="box"><div class="hd"><b>ตรวจคำผิด</b><span><button id="spAll" class="pri">แก้ทั้งหมดที่เป็นคำผิด</button> <button id="spClose">ปิด</button></span></div><div class="bd" id="spList"></div></div></div>

const FONT_LH={"TH SarabunIT๙":1.10,"TH SarabunPSK":1.297,"TH Sarabun New":1.297}; // ระยะบรรทัด 1 เท่าของ Word ตามค่าในฟอนต์
let AUTOF=0;
const lspF=()=>AUTOF||({"0.95 เท่า (กระชับ)":0.95,"0.9 เท่า (กระชับมาก)":0.9}[D.lsp]||1);
const lineH=()=>(FONT_LH[D.font]||1.2)*lspF();
const blockH=f=>f.lines.length*lineH()*16*25.4/72+(f.qr?QR+1:0)+0.5;   // ความสูงส่วนท้าย (มม.)
const SEG=(typeof Intl!=="undefined"&&Intl.Segmenter)?new Intl.Segmenter("th",{granularity:"word"}):null;
// พยายามไม่ตัดกลางกลุ่ม ตัวเลข+หน่วย ("๐๙.๓๐ น." "๑ ฉบับ") และ "พ.ศ. ๒๕๖๙" (ยอมแยกถ้าทำให้ยืดมาก)
const NOBRK=/[0-9๐-๙][0-9๐-๙.,:]*\s+(?:น\.|นาฬิกา|บาท|คน|ราย|ฉบับ|ชุด|แผ่น|เล่ม|ครั้ง)/g;
const NOBRK2=/(?:พ\.ศ\.|ค\.ศ\.)\s*[0-9๐-๙]+/g;
const nbsp=t=>t.replace(NOBRK,m=>m.replace(/ /g,"\u00A0")).replace(NOBRK2,m=>m.replace(/ /g,"\u00A0"));  // Word: ใช้ช่องว่างไม่ตัดบรรทัด
const NOBRK3=/ลงวันที่|สิ่งที่ส่งมาด้วย|ผู้ว่าราชการจังหวัด|(?:มกราคม|กุมภาพันธ์|มีนาคม|เมษายน|พฤษภาคม|มิถุนายน|กรกฎาคม|สิงหาคม|กันยายน|ตุลาคม|พฤศจิกายน|ธันวาคม)\s+[0-9๐-๙]{4}/g;  // วลีคงที่ (แยกได้ถ้าทำให้ยืดมาก)
// คำ/คำย่อที่ห้ามแยกเด็ดขาด (ตัวตัดคำของเบราว์เซอร์แยกผิด)
const HARD=/ผู้อำนวยการ|ผู้ว่าราชการ|ผู้บัญชาการ|ผู้บังคับการ|ผู้กำกับการ|ผู้ช่วย|ผู้แทน|นักวิชาการ|นักวิเคราะห์|นักจัดการ|ราชการ|อัยการ|พร้อมเพรียง|ผู้ประสบภัย|สาธารณภัย|อุทกภัย|กากีคอพับ|(?:[ก-ฮ]{1,4}\.){1,}[ก-ฮ]{1,4}\.?|\([^()\s]{1,8}\)/g;
function mergeRanges(t,parts,res){const R=[];for(const re of res)for(const m of t.matchAll(re))R.push([m.index,m.index+m[0].length]);
 if(!R.length)return parts.map(x=>[x]);
 const out=[];let pos=0;
 for(const x of parts){const a=pos;pos+=x.length;
  if(out.length&&R.some(([s,e])=>a>s&&a<e))out[out.length-1].push(x);else out.push([x]);}
 return out;}
function segWords(t){   // คืน [{t, sub}] — sub = ชิ้นย่อยที่ยอมแยกได้ถ้าจำเป็น
 let parts=SEG?[...SEG.segment(t)].map(x=>x.segment):t.split(/(\s+)/);
 parts=mergeRanges(t,parts,[HARD]).map(g=>g.join(""));
 // "ผู้"/"นัก" ต้องติดกับคำถัดไปเสมอ
 parts=parts.reduce((o,x)=>{const l=o[o.length-1];if((l==='ผู้'||l==='นัก')&&!/^\s/.test(x))o[o.length-1]+=x;else o.push(x);return o;},[]);
 return mergeRanges(t,parts,[NOBRK,NOBRK2,NOBRK3]).map(g=>({t:g.join(""),sub:g.length>1?g:null}));
}
function splitFirst(t,w){            // ตัดข้อความไทยตามคำ ให้บรรทัดแรกกว้างไม่เกิน w มม.
 if(measure(t)<=w)return [t,""];
 // ตัดที่ช่องว่างก่อน (เหมือนหนังสือจริง เช่นไม่แยก "ลงวันที่") ถ้าไม่มีช่องว่างที่พอดีจึงตัดตามคำ
 const sp=t.split(/(\s+)/); let c2="",k2=0;
 for(;k2<sp.length;k2++){if(measure(c2+sp[k2])>w)break;c2+=sp[k2];}
 if(c2.trim()&&measure(c2)>w*0.6)return [c2.trimEnd(),sp.slice(k2).join("").trimStart()];
 const parts=SEG?segWords(t).map(x=>x.t):sp;
 let cur="",k=0;
 for(;k<parts.length;k++){if(measure(cur+parts[k])>w)break;cur+=parts[k];}
 if(!cur){for(const ch of t){if(measure(cur+ch)>w)break;cur+=ch;}return [cur,t.slice(cur.length).trimStart()];}
 return [cur.trimEnd(),parts.slice(k).join("").trimStart()];
}
const UNITS=["ชุด","ฉบับ","แผ่น","เล่ม","แผ่นซีดี","แฟ้ม"];
function refText(r){   // หนังสือ[หน่วยงาน] [ชั้นความเร็ว] ที่ ... ลงวันที่ ...
 if(r.free&&r.free.trim())return r.free.trim();
 if(!r.org&&!r.no&&!r.date)return "";
 const d=r.date?(()=>{const [y,m,dd]=r.date.split("-").map(Number);return `${dd} ${MON[m-1]} ${y+543}`;})():"";
 return [`หนังสือ${(r.org||"").trim()}`, r.speed||"", r.no?`ที่ ${r.no.trim()}`:"", d?`ลงวันที่ ${d}`:""].filter(x=>x).join(" ");
}
function enclText(e){
 const t=(e.text||"").trim(); if(!t)return "";
 return e.qty&&String(e.qty).trim()?`${t} จำนวน ${String(e.qty).trim()} ${e.unit||"ชุด"}`:t;
}

// ---------- สร้างโครงหนังสือ (ใช้ร่วมกันทั้งพรีวิว / Word / PDF) ----------
function build(){
 const P=[],F=[]; WARN=[];
 const R=(t,o={})=>Object.assign({t},o), TAB={tab:true}, RTAB={rtab:true};
 const rich=t=>t.split(/(\*\*[^*]+\*\*|__[^_]+__)/).filter(x=>x).map(x=>x.startsWith('**')?R(x.slice(2,-2),{b:true}):x.startsWith('__')?R(x.slice(2,-2),{u:true}):R(x));
 let KEEP=false, SIG0=-1;
 const para=o=>{P.push(Object.assign({runs:[],jc:"left",indL:0,indR:0,first:0,hang:0,before:0,keep:KEEP},o));};
 // ระเบียบ: หน้าสุดท้ายต้องมีข้อความอย่างน้อย 2 บรรทัดก่อนคำลงท้าย → ถ้าย่อหน้าสุดท้ายมีบรรทัดเดียว ให้ดึงย่อหน้าก่อนหน้า (ถ้าไม่ยาวเกิน 4 บรรทัด) ไปด้วย
 const estLines=p=>{const t=(p.runs||[]).map(r=>r.t||"").join("");if(!t.trim())return 0;return Math.ceil((measure(t)+Math.max(0,p.first||0))/(CW-p.indL-p.indR));};
 const keepFromLast=()=>{let i=P.length-1;if(i<0){KEEP=true;return;}P[i].keep=true;let n=estLines(P[i]);
  while(n<2&&i>0){i--;const m=estLines(P[i]);if(!m)continue;if(m>4)break;P[i].keep=true;n+=m;}
  KEEP=true;};
 const blank=(n=1)=>{for(let i=0;i<n;i++)para({runs:[]});};
 const labelList=(label,items,before,numbered=true,sz=16,b=false)=>{
  if(!items.length)return;
  const H=measure(label,sz,b)+measure("  ");
  const num=numbered&&items.length>1, NW=num?measure(items.length>9?"10.":"8.")+measure("  "):0;  // บรรทัดที่ขึ้นใหม่เยื้องตรงข้อความหลังตัวเลข
  items.forEach((it,i)=>{let txt=it, q=null;
   const m=txt.match(/^([\s\S]*?)\s+(จำนวน\s[^\n]*)$/); if(m){txt=m[1];q=m[2];}
   // ผู้ใช้กด Enter เอง: บรรทัดแรกใช้กับ "จำนวน" ส่วนบรรทัดถัดไปขึ้นใหม่ตรงแนวข้อความ
   const man=txt.split("\n").map(x=>x.trim()).filter(x=>x); txt=man.shift()||"";   // "จำนวน ... ชุด" ชิดขวา
   // มี "จำนวน": ให้อยู่บรรทัดแรกชิดขวาเสมอ — ตัดชื่อเอกสารบรรทัดแรกให้พอดีช่องที่เหลือ ส่วนที่เหลือขึ้นบรรทัดใหม่ (ไม่ล้ำเข้าแนวจำนวน)
   let rest="", QW=0;
   if(q){QW=measure(q)+4; const [a,b2]=splitFirst(txt,CW-(H+NW)-QW-2); txt=a; rest=b2;}
   const tail=q?[RTAB,R(q)]:[], nr=num?[R(`${i+1}.`),TAB]:[];
   const ind=(num||i===0)?H+NW:H;
   if(i===0)para({runs:[R(label,{sz,b}),TAB,...nr,R(txt),...tail],indL:H+NW,hang:H+NW,tabAt:H,tabAt2:num?H+NW:null,numW:NW,kind:"label",before,rtab:!!q,nowrap:!!q,jc:q?"left":"dist"});
   else if(num)para({runs:[...nr,R(txt),...tail],indL:H+NW,hang:NW,tabAt:H+NW,kind:"num",numW:NW,rtab:!!q,nowrap:!!q,jc:q?"left":"dist"});
   else para({runs:[R(txt),...tail],indL:H,rtab:!!q,nowrap:!!q,jc:q?"left":"dist"});
   if(rest)para({runs:[R(rest)],indL:ind,indR:QW,jc:"dist"});
   man.forEach(x=>para({runs:[R(x)],indL:ind,jc:"dist"}));});
 };
 const body=(txt,gap0=true)=>{
  // บรรทัดที่ลงท้ายด้วย ↵ (Shift+Enter) = ตัดบรรทัดบังคับ ในย่อหน้าเดียวกัน
  const ls0=(txt||"").split("\n"), ls=[];
  for(const x of ls0){if(ls.length&&/↵\s*$/.test(ls[ls.length-1]))ls[ls.length-1]+="\u0001"+x;else ls.push(x);}
  let gap=gap0;
  for(const raw0 of ls){const raw=raw0.replace(/↵\s*$/,""); if(raw.trim()===""){gap=true;continue;}
   const m=raw.match(/^(>*)\s*(.*)$/);const lvl=m[1].length;
   const runs=[];m[2].split("\u0001").forEach((seg,j)=>{if(j)runs.push({t:"",br:true});runs.push(...rich(seg.replace(/↵\s*$/,"")));});
   para({runs,first:25+5*lvl,jc:"dist",before:gap?6:0,kn:/(ดังนี้|ดังต่อไปนี้|ประกอบด้วย|:)\s*$/.test(m[2])});gap=false;}   // ข้อความนำรายการ ห้ามค้างท้ายหน้า
 };
 const endp=()=>{   // ย่อหน้าสุดท้าย (จึงเรียนมาเพื่อ...) จากรายการเลือก
  let t=D.endp||ENDP[0]; if(t===ENDP[0])return; if(t===ENDP[ENDP.length-1])t=(D.endpX||"").trim(); if(!t)return;
  if(/^(กราบเรียน)$/.test(D.sal||""))t=t.replace(/^จึงเรียน/,"จึงกราบเรียน");
  para({runs:rich(t),first:25,jc:"dist",before:6});};
 const secs=()=>{   // หัวข้อบันทึก ๑. ต้นเรื่อง ๒. ข้อเท็จจริง ...
  (D.secs||[]).forEach((x,i)=>{const nm=x.h===MSEC[MSEC.length-1]?(x.name||"").trim():x.h;if(!nm&&!(x.text||"").trim())return;
   para({runs:[R(`${i+1}. ${nm}`,{b:true})],first:25,before:6,kn:true});
   body(x.text,false);});};
 const sign=(extraBlank=3,cx=97)=>{
  if(SIG0<0)SIG0=P.length;
  blank(extraBlank);
  const half=Math.min(cx,CW-cx)-0.5, iL=cx-half, iR=CW-cx-half;
  const nm=(D.name||"").trim();
  if(nm)para({runs:[R(`(${nm})`)],jc:"center",indL:iL,indR:iR});
  for(const l of lines(D.pos))para({runs:[R(l)],jc:"center",indL:iL,indR:iR});
 };
 const owner=(stamp)=>{
  const L=[...lines(D.owner)];
  if(D.tel&&D.fax&&D.tel.trim()===D.fax.trim())L.push("โทร./โทรสาร "+D.tel);
  else{if(D.tel)L.push("โทร. "+D.tel);if(D.fax)L.push("โทรสาร "+D.fax);}
  if(D.email)L.push("ไปรษณีย์อิเล็กทรอนิกส์ "+D.email);
  const cc=stamp?[]:lines(D.cc);
  if(!L.length)return;
  if(D.qr&&!stamp)L.unshift("สิ่งที่ส่งมาด้วย");
  // อัตโนมัติ: มี QR → วางข้างลายมือชื่อ (แบบหนังสือ ว 13301) / ไม่มี → ต่อจากตำแหน่ง เว้น 1 บรรทัด (แบบหนังสือ ว 12412)
  const qr=(D.qr&&!stamp)?D.qr:null;
  let mode=D.ownerPos||"อัตโนมัติ"; if(mode==="อัตโนมัติ")mode=qr?"side":"after";
  else mode={"ต่อจากตำแหน่ง (เว้น 1 บรรทัด)":"after","ข้างลายมือชื่อ (ซ้าย)":"side","ชิดขอบล่าง":"bottom"}[mode]||"after";
  if(stamp&&mode==="side")mode="after";
  if(mode==="after"&&qr)mode="side";
  if(mode!=="side"&&cc.length){L.push("");L.push("สำเนาส่ง  "+cc[0]);cc.slice(1).forEach(x=>L.push("              "+x));}
  if(mode==="after"){blank(stamp?4:1);L.forEach(x=>x?para({runs:[R(x)]}):blank(1));}   // หนังสือประทับตรา: เว้นที่ให้ตราชื่อส่วนราชการ
  else F.push({kind:"block",lines:L,qr,mode,at:mode==="side"?P.length-1:undefined});
  const sb=F.find(f=>f.kind==="block"&&f.mode==="side");
  if(sb&&SIG0>=0){const LHmm=lineH()*16*25.4/72, n=P.length-SIG0, sigH=n*LHmm;
   const need=blockH(sb)+2-sigH; if(need>0)P[SIG0].before+=mm2pt(need);}
  // สำเนาส่ง: เมื่อส่วนราชการเจ้าของเรื่องอยู่ข้างลายมือชื่อ ให้ขึ้นบรรทัดใหม่ใต้ทั้งหมด เต็มความกว้าง
  if(sb&&cc.length){KEEP=false;blank(1);labelList("สำเนาส่ง",cc,0,false);}
 };

  const MAXW=CW-93, a=[];   // ที่อยู่เริ่มไม่ล้ำครุฑ (≥ 12.3 ซม. จากขอบซ้ายกระดาษ)

  }

const SP_NOTE={"$1 ๆ":"เว้นวรรคหน้าไม้ยมก (ราชบัณฑิตยสภา)","ๆ ":"เว้นวรรคหลังไม้ยมก"," ":"เว้นวรรคซ้อนเกิน 1 ช่อง"};
const WDAY=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
function spellFields(){const out=[];const lab={};for(const [k,l] of TYPES[TYPE].fields.concat(COMMON))lab[k]=l;
 for(const [k,l,kind] of TYPES[TYPE].fields)if(["text","area","bigarea",undefined].includes(kind)&&typeof D[k]==="string"&&k!=="sec")out.push({label:l,get:()=>D[k]||"",set:v=>{D[k]=v;}});
 for(const k of ["endpX"])if(D[k])out.push({label:lab[k]||k,get:()=>D[k],set:v=>{D[k]=v;}});
 (D.refList||[]).forEach((it,i)=>["org","no","free"].forEach(f=>{if(it[f])out.push({label:`อ้างถึง ${i+1}`,get:()=>it[f]||"",set:v=>{it[f]=v;}});}));
 (D.enclList||[]).forEach((it,i)=>{if(it.text)out.push({label:`สิ่งที่ส่งมาด้วย ${i+1}`,get:()=>it.text||"",set:v=>{it.text=v;}});});
 (D.secs||[]).forEach((it,i)=>{if(it.text)out.push({label:`หัวข้อ ${i+1}. ${it.h===MSEC[MSEC.length-1]?it.name||"":it.h}`,get:()=>it.text||"",set:v=>{it.text=v;}});
  if(it.name)out.push({label:`ชื่อหัวข้อ ${i+1}`,get:()=>it.name,set:v=>{it.name=v;}});});
 return out;}
const TMON=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const arab=t=>t.replace(/[๐-๙]/g,d=>"๐๑๒๓๔๕๖๗๘๙".indexOf(d));
function spellScan(){const res=[];
 for(const f of spellFields()){const t=f.get();
  for(const [re,rp,lv] of SPELL){re.lastIndex=0;let m;
   while((m=re.exec(t))){const tail=t.slice(m.index),r2=tail.replace(new RegExp(re.source),rp),fix=r2.slice(0,r2.length-(tail.length-m[0].length));
    if(fix!==m[0])res.push({f,re,rp,lv,w:m[0],fix,i:m.index,note:SP_NOTE[rp]||""});if(m[0].length===0)re.lastIndex++;}}
  // วันในสัปดาห์ต้องตรงกับวันที่ เช่น "วันศุกร์ที่ 27 พฤศจิกายน 2569"
  const wre=new RegExp(`วัน(?:\\*\\*|__)?(${WDAY.join("|")})ที่(?:\\*\\*|__)?\\s*([0-9๐-๙]{1,2})\\s*(${TMON.join("|")})\\s*(?:พ\\.ศ\\.\\s*)?([0-9๐-๙]{4})`,"g");let m;
  while((m=wre.exec(t))){const d=+arab(m[2]),mo=TMON.indexOf(m[3]),y=+arab(m[4])-543;const dt=new Date(y,mo,d);
   if(dt.getMonth()!==mo)res.push({f,lv:"err",w:m[0],fix:null,i:m.index,note:`ไม่มีวันที่ ${m[2]} ${m[3]}`});
   else if(WDAY[dt.getDay()]!==m[1])res.push({f,lv:"err",w:m[0],fix:m[0].replace(m[1]+"ที่",WDAY[dt.getDay()]+"ที่"),i:m.index,note:`วันที่ ${m[2]} ${m[3]} ${m[4]} ตรงกับวัน${WDAY[dt.getDay()]}`});}}
 return res.filter(r=>!res.some(o=>o!==r&&o.f===r.f&&o.i<=r.i&&o.i+o.w.length>=r.i+r.w.length&&o.w.length>r.w.length));}
function spellShow(){const res=spellScan(),L=document.getElementById("spList");L.innerHTML="";
 if(!res.length)L.innerHTML=`<div style="padding:18px;text-align:center;color:#18794e">✓ ไม่พบคำที่มักเขียนผิด<br><small style="color:#6b7684">ระบบตรวจจากรายการคำผิดที่พบบ่อยในหนังสือราชการ และวันในสัปดาห์กับวันที่ · คำที่ไม่อยู่ในรายการให้ดูเส้นใต้สีแดงในช่องกรอก (ตัวตรวจของเบราว์เซอร์ ถ้าเครื่องมีพจนานุกรมไทย)</small></div>`;
 res.forEach(r=>{const t=r.f.get(),a=Math.max(0,r.i-25),b=Math.min(t.length,r.i+r.w.length+25);
  const it=el("div",{class:"it"},`<div><b>${esc(r.f.label)}</b><span class="lv ${r.lv}">${r.lv==="err"?"คำผิด":"ข้อแนะนำ"}</span></div>
   <div style="margin-top:3px"><span class="w">${esc(r.w.replace(/ /g,"␣"))}</span> → ${r.fix!==null?`<span class="r">${esc(r.fix.replace(/ /g,"␣"))}</span>`:"<i>ตรวจแก้เอง</i>"} ${r.note?`<small style="color:#6b7684">(${esc(r.note)})</small>`:""}</div>
   <div class="ctx">…${esc(t.slice(a,r.i))}<u>${esc(r.w)}</u>${esc(t.slice(r.i+r.w.length,b))}…</div>`);
  if(r.fix!==null){const bt=el("button",{type:"button",style:"margin-top:5px"},"แก้");bt.onclick=()=>{const v=r.f.get();if(v.substr(r.i,r.w.length)===r.w){r.f.set(v.slice(0,r.i)+r.fix+v.slice(r.i+r.w.length));save();renderForm();update();}spellShow();};it.appendChild(bt);}
  L.appendChild(it);});
 document.getElementById("spAll").style.display=res.some(r=>r.lv==="err"&&r.fix!==null)?"":"none";
 document.getElementById("spell").style.display="flex";}
document.getElementById("bSpell").onclick=spellShow;
document.getElementById("spClose").onclick=()=>{document.getElementById("spell").style.display="none";};
document.getElementById("spAll").onclick=()=>{for(const r of spellScan().filter(r=>r.lv==="err"&&r.fix!==null).sort((a,b)=>b.i-a.i)){const v=r.f.get();if(v.substr(r.i,r.w.length)===r.w)r.f.set(v.slice(0,r.i)+r.fix+v.slice(r.i+r.w.length));}save();renderForm();update();spellShow();};

 if(d.body!==undefined)d.body=(d.body||"")+(d.body?"\nเพื่อให้การดำเนินงานต่างๆ เป็นไปด้วยความเรียบร้อย":"");

load();document.documentElement.style.setProperty("--docfont",`"${D.font}","TH SarabunPSK","TH Sarabun New",sans-serif`);renderTabs();renderForm();
