<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบจัดหน้าหนังสือราชการ</title>
<style>
:root{--ui:"Segoe UI","Leelawadee UI",Tahoma,sans-serif;--accent:#1f5fbf}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ui);background:#e9edf2;color:#1d2530}
#app{display:flex;height:100vh}
#side{width:600px;min-width:460px;max-width:48vw;background:#fff;border-right:1px solid #cfd6df;display:flex;flex-direction:column}
#side header{padding:12px 14px;border-bottom:1px solid #e1e6ec}
#side h1{font-size:17px;margin:0 0 8px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{border:1px solid #c5cfdb;background:#f5f7fa;border-radius:6px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#form{flex:1;overflow:auto;padding:10px 14px 30px}
.f{margin:0 0 9px}
.f label{display:block;font-size:12.5px;font-weight:600;color:#3a4656;margin-bottom:3px}
.f small{font-weight:400;color:#6b7684}
.f input[type=text],.f input[type=date],.f select,.f textarea{width:100%;font:inherit;font-size:14px;padding:6px 8px;border:1px solid #c5cfdb;border-radius:6px;background:#fff}
.f textarea{resize:vertical;min-height:54px}
.f textarea.big{min-height:0}
.frow{display:flex;gap:10px;align-items:flex-end}.frow>.f{flex:1 1 0;min-width:0}.frow>.f[data-k="date"]{flex:1.4 1 0}.frow>.f[data-k="speed"],.frow>.f[data-k="sal"],.frow>.f[data-k="kind"]{flex:0 0 auto;min-width:110px}.frow>.f[data-k="to"],.frow>.f[data-k="org"]{flex:3 1 0}.frow label small{display:none}.frow>.f[data-k="date"] select:last-child{min-width:112px;flex:0 0 auto!important}.f.inl{display:flex;align-items:center;gap:10px}.f.inl>label{margin:0;white-space:nowrap}.f.inl>input{flex:1}
details.secbox{border-bottom:1px solid #e6ebf1;padding-bottom:4px;margin-bottom:4px}
details.secbox>summary{cursor:pointer;list-style:none;user-select:none}
details.secbox>summary::before{content:"▸ ";color:#1f5fbf}details.secbox[open]>summary::before{content:"▾ "}
.hint{display:inline-block;color:#1f5fbf;cursor:help;font-size:12px;font-weight:normal}
.lcard{border:1px solid #d5dce5;border-radius:7px;padding:5px 6px;background:#fafbfd}
.lrow{display:flex;gap:5px;align-items:center}.lrow+.lrow{margin-top:4px}
.f .lrow .li{font:inherit;font-size:13.5px;padding:4px 6px;border:1px solid #c5cfdb;border-radius:5px;min-width:0;width:auto;background:#fff;flex:0 1 auto}
.f .lrow input.li{flex:1 1 0}.f .lrow textarea.lta{flex:1 1 0;width:auto;resize:none;overflow:hidden;line-height:1.35;min-height:31px}
.lnum{flex:0 0 18px;font-size:13px;color:#55606e}.lsm{font-size:12.5px;color:#55606e;white-space:nowrap}
.ldel{flex:0 0 auto;font-size:12px;border:1px solid #e0b4b4;background:#fff5f5;color:#a33;border-radius:5px;padding:3px 7px;cursor:pointer}
.ltg{flex:0 0 auto;font-size:12px;border:1px solid #c5cfdb;background:#fff;color:#1f5fbf;border-radius:5px;padding:3px 7px;cursor:pointer;white-space:nowrap}
textarea.docta{font-family:var(--docfont);line-height:1.3;padding:6px 8px}
.row{display:flex;gap:8px}.row>.f{flex:1}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0}
.sec{font-size:12px;font-weight:700;color:var(--accent);text-transform:none;margin:14px 0 6px;border-top:1px dashed #d6dde6;padding-top:8px}
#actions{padding:10px 14px;border-top:1px solid #e1e6ec;display:flex;flex-wrap:wrap;gap:6px}
#actions button{font:inherit;font-size:13.5px;padding:7px 11px;border-radius:6px;border:1px solid #c5cfdb;background:#fff;cursor:pointer}
#actions button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
#msg{font-size:12.5px;color:#a33;padding:0 14px 8px;min-height:6px}
#main{flex:1;overflow:auto;padding:18px}
#bar{display:flex;gap:14px;align-items:center;font-size:13px;margin-bottom:10px;flex-wrap:wrap}
#warn{color:#b00;font-size:13px}
.vsw{display:inline-flex;border:1px solid #1f5fbf;border-radius:7px;overflow:hidden}
.vsw button{font:inherit;font-size:13px;padding:5px 11px;border:0;background:#fff;color:#1f5fbf;cursor:pointer}
.vsw button.on{background:#1f5fbf;color:#fff}
.vsw button:disabled{color:#aab;cursor:not-allowed}
#stage{position:relative}
.page{position:relative;width:210mm;min-height:297mm;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);transform-origin:top left}
.content{position:absolute;left:30mm;top:25mm;width:160mm}
.doc{font-family:var(--docfont);font-size:16pt;line-height:var(--lh,1.1);color:#000}
.doc p{margin:0;white-space:pre-wrap;word-break:normal;line-break:auto}
.doc p.dist{text-align:justify;text-justify:inter-character}
.fl{position:absolute;white-space:pre;line-height:normal;font-family:var(--docfont)}
.guide{position:absolute;pointer-events:none}
.page.multi{background:transparent;box-shadow:none}
.sheet{position:absolute;left:0;width:210mm;height:297mm;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.pgno{position:absolute;left:0;width:210mm;text-align:center;font-size:16pt;line-height:1}
.fmtbar{display:flex;gap:4px;margin:2px 0 3px}
.fmtbar button{font:inherit;font-size:12.5px;padding:2px 9px;border:1px solid #c5cfdb;border-radius:5px;background:#fff;cursor:pointer}
.fmtbar button:hover{background:#eef3fb;border-color:#1f5fbf}
.pb{position:absolute;left:0;right:0;border-top:2px dashed #e33;pointer-events:none}
.pb span{position:absolute;right:4px;top:-18px;font:12px var(--ui);color:#e33;background:#fff}
#print{display:none}
@media print{
  #app{display:none}
  #print{display:flow-root;position:relative}
  body{background:#fff}
}
#spell{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;z-index:50}
#spell .box{background:#fff;width:min(760px,94vw);max-height:86vh;border-radius:10px;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#spell .hd{padding:12px 16px;border-bottom:1px solid #e1e6ec;display:flex;justify-content:space-between;align-items:center}
#spell .bd{padding:10px 16px;overflow:auto;font-size:14px}
#spell .it{border:1px solid #e1e6ec;border-radius:7px;padding:7px 9px;margin-bottom:7px}
#spell .it .w{color:#c22;text-decoration:line-through} #spell .it .r{color:#18794e;font-weight:bold}
#spell .it .ctx{color:#59636e;font-size:13px;margin-top:3px} #spell .it .lv{font-size:11px;border-radius:4px;padding:1px 6px;margin-left:6px}
#spell .err{background:#fde8e8;color:#b42318} #spell .sug{background:#fff4d6;color:#8a5a00}
#spell button{font:inherit;font-size:13px;padding:3px 10px;border:1px solid #c5cfdb;border-radius:6px;background:#fff;cursor:pointer}
#spell button.pri{background:#1f5fbf;color:#fff;border-color:#1f5fbf}
</style>
<style id="pagecss"></style>
</head>
<body>
<div id="app">
 <div id="side">
  <header>
   <h1>ระบบจัดหน้าหนังสือราชการ</h1>
   <div class="tabs" id="tabs"></div>
  </header>
  <div id="form"></div>
  <div id="msg"></div>
  <div id="actions">
   <button class="pri" id="bDocx">ดาวน์โหลด Word (.docx)</button>
   <button id="bBoth">Word ทั้ง 2 ฉบับ</button>
   <button class="pri" id="bPrint">พิมพ์ / บันทึก PDF</button>
   <button id="bSpell">ตรวจคำผิด</button>
   <button id="bSample">ใส่ข้อมูลตัวอย่าง</button>
   <button id="bTypo">ตัวอย่างที่มีคำผิด</button>
   <button id="bClear">ล้างข้อมูล</button>
  </div>
 </div>
 <div id="main">
  <div id="bar">
   <span class="vsw"><button id="vReal" class="on">ฉบับจริง (ส่งออก)</button><button id="vCopy">สำเนาคู่ฉบับ (เก็บต้นเรื่อง)</button></span>
   <label class="chk"><input type="checkbox" id="gOn" checked> แสดงเส้นแนวตรวจ</label>
   <label class="chk">ย่อ/ขยาย <input type="range" id="zoom" min="40" max="120" value="75"></label>
   <span id="fontinfo"></span>
   <span id="warn"></span>
  </div>
  <div id="stage"><div class="page" id="page"></div></div>
 </div>
</div>
<div id="print"></div>
<div id="spell"><div class="box"><div class="hd"><b>ตรวจคำผิด</b><span><button id="spAll" class="pri">แก้ทั้งหมดที่เป็นคำผิด</button> <button id="spClose">ปิด</button></span></div><div class="bd" id="spList"></div></div></div>

// Shift+Enter = ตัดบรรทัดบังคับ (แสดงเป็น ↵ ท้ายบรรทัด)
function shiftEnter(ta){ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.shiftKey){e.preventDefault();
 const a=ta.selectionStart,b=ta.selectionEnd;ta.value=ta.value.slice(0,a)+"↵\n"+ta.value.slice(b);ta.selectionStart=ta.selectionEnd=a+2;ta.dispatchEvent(new Event("input"));}});}
// แถบปุ่มจัดรูปแบบเหนือช่องข้อความ: คลุมคำแล้วกด "ตัวหนา" (Ctrl+B) / "ขีดเส้นใต้" (Ctrl+U) — กดซ้ำเพื่อยกเลิก
function wrapSel(ta,mk){const a=ta.selectionStart,b=ta.selectionEnd,v=ta.value;
 if(a===b){ta.focus();return;}
 let sel=v.slice(a,b),pre=v.slice(0,a),post=v.slice(b);
 if(sel.startsWith(mk)&&sel.endsWith(mk)&&sel.length>=mk.length*2){sel=sel.slice(mk.length,-mk.length);ta.value=pre+sel+post;ta.setSelectionRange(a,a+sel.length);}
 else if(pre.endsWith(mk)&&post.startsWith(mk)){ta.value=pre.slice(0,-mk.length)+sel+post.slice(mk.length);ta.setSelectionRange(a-mk.length,b-mk.length);}
 else{const lead=sel.match(/^\s*/)[0],trail=sel.match(/\s*$/)[0],core=sel.trim();ta.value=pre+lead+mk+core+mk+trail+post;ta.setSelectionRange(a+lead.length,a+lead.length+core.length+mk.length*2);}
 ta.focus();ta.dispatchEvent(new Event("input"));}
function fmtBar(ta){const bar=el("div",{class:"fmtbar"});
 const B=(html,title,fn)=>{const b=el("button",{type:"button",title},html);b.onmousedown=e=>e.preventDefault();b.onclick=fn;bar.appendChild(b);};
 B("<b>ตัวหนา</b>","คลุมคำแล้วกด (Ctrl+B)",()=>wrapSel(ta,"**"));
 B("<u>ขีดเส้นใต้</u>","คลุมคำแล้วกด (Ctrl+U)",()=>wrapSel(ta,"__"));
 B("↵ ตัดบรรทัดตรงนี้","เหมือนกด Shift+Enter",()=>{const a=ta.selectionStart;ta.value=ta.value.slice(0,a)+"↵\n"+ta.value.slice(ta.selectionEnd);ta.setSelectionRange(a+2,a+2);ta.focus();ta.dispatchEvent(new Event("input"));});
 ta.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey){const k=e.key.toLowerCase();
  if(k==="b"||e.code==="KeyB"){e.preventDefault();wrapSel(ta,"**");}else if(k==="u"||e.code==="KeyU"){e.preventDefault();wrapSel(ta,"__");}}});
 return bar;}

  `text-indent:${p.first?p.first:(p.hang?-p.hang:0)}mm`,`text-align:${p.jc==="dist"?"justify":p.jc}`];
 if(!p.runs.length||p.runs.every(r=>!r.tab&&!r.t))return `<p style="${st.join(";")}">&nbsp;</p>`;
 if(p.jc==="dist"&&!p.rtab)return distHTML(p,st);
 let h="";
 if(p.kind==="label"){const i=p.runs.findIndex(r=>r.tab);
  const lw=p.hang-(p.numW||0);
  let rest=p.runs.slice(i+1), nh="";
  if(p.numW){const j=rest.findIndex(r=>r.tab);nh=`<span style="display:inline-block;text-indent:0;min-width:${p.numW}mm">${rest.slice(0,j).map(runHTML).join("")}</span>`;rest=rest.slice(j+1);}
  h=`<span style="display:inline-block;text-indent:0;min-width:${lw}mm">${p.runs.slice(0,i).map(runHTML).join("")}</span>`+nh+runsHTML(rest);}
 else if(p.kind==="num"){const j=p.runs.findIndex(r=>r.tab);
  h=`<span style="display:inline-block;text-indent:0;min-width:${p.numW}mm">${p.runs.slice(0,j).map(runHTML).join("")}</span>`+runsHTML(p.runs.slice(j+1));}
 else if(p.kind==="abs"){const i=p.runs.findIndex(r=>r.tab);
  if(i<0)h=p.runs.map(runHTML).join("");
  else{st.push("position:relative");h=p.runs.slice(0,i).map(runHTML).join("")+`<span style="position:absolute;left:${p.tabAt}mm;top:0;text-indent:0;white-space:nowrap">${p.runs.slice(i+1).map(runHTML).join("")}</span>`;}}
 else h=runsHTML(p.runs);
 if(p.nowrap)st.push("white-space:nowrap");
 return `<p class="${p.jc==="dist"?"dist":""}" style="${st.join(";")}">${h}</p>`;
}

function parasHTML(P,F){let h="",grp="",side=sideHTML(F);
 const close=()=>{if(grp){h+=`<div style="break-inside:avoid;position:relative">${grp}${side}</div>`;grp="";side="";}};
 let kn="";for(const p of P){if(p.keep){if(kn){close();h+=`<div style="break-inside:avoid">${kn}</div>`;kn="";}grp+=paraHTML(p);continue;}

const PGAP=8, PSTEP=297+PGAP;

  if(ch.classList.contains("jp"))units.push(...ch.children); else units.push(ch);}
 let k=0;
 for(const u of units){
  const r=u.getBoundingClientRect(), t=mm(r.top-top0), b=mm(r.bottom-top0);
  const bot=k*PSTEP+25+252;
  if(b>bot+0.3&&t>k*PSTEP+25+1){k++;
   const sp=document.createElement("div");sp.className="pgsp";sp.style.height=(k*PSTEP+25-t)+"mm";u.before(sp);}
 }

 const {P,F}=build();

 const render=()=>{document.documentElement.style.setProperty("--lh",String(lineH()));
  pg.innerHTML=(document.getElementById("gOn").checked?guidesHTML():"")+`<div class="content doc" id="content">${parasHTML(P,F)}</div>`;
  justify(pg);
  return document.getElementById("content").offsetHeight*25.4/96;};

function crc32(a){let c=0xFFFFFFFF;for(let i=0;i<a.length;i++)c=CRC[(c^a[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zip(files){
 const enc=new TextEncoder();const parts=[];const cen=[];let off=0;
 for(const [name,data] of files){const nb=enc.encode(name),crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);
  parts.push(new Uint8Array(h.buffer),nb,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
  cen.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+data.length;}
 const csz=cen.reduce((s,x)=>s+x.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

 (D.enclList||[]).forEach((it,i)=>{if(it.text)out.push({label:`สิ่งที่ส่งมาด้วย ${i+1}`,get:()=>it.text||"",set:v=>{it.text=v;}});});
 (D.secs||[]).forEach((it,i)=>{if(it.text)out.push({label:`หัวข้อ ${i+1}. ${it.h===MSEC[MSEC.length-1]?it.name||"":it.h}`,get:()=>it.text||"",set:v=>{it.text=v;}});
  if(it.name)out.push({label:`ชื่อหัวข้อ ${i+1}`,get:()=>it.name,set:v=>{it.name=v;}});});
 return out;}
const TMON=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const arab=t=>t.replace(/[๐-๙]/g,d=>"๐๑๒๓๔๕๖๗๘๙".indexOf(d));
function spellScan(){const res=[];
 for(const f of spellFields()){const t=f.get();
  for(const [re,rp,lv] of SPELL){re.lastIndex=0;let m;
   while((m=re.exec(t))){const tail=t.slice(m.index),r2=tail.replace(new RegExp(re.source),rp),fix=r2.slice(0,r2.length-(tail.length-m[0].length));
    if(fix!==m[0])res.push({f,re,rp,lv,w:m[0],fix,i:m.index,note:SP_NOTE[rp]||""});if(m[0].length===0)re.lastIndex++;}}
  // วันในสัปดาห์ต้องตรงกับวันที่ เช่น "วันศุกร์ที่ 27 พฤศจิกายน 2569"
  const wre=new RegExp(`วัน(?:\\*\\*|__)?(${WDAY.join("|")})ที่(?:\\*\\*|__)?\\s*([0-9๐-๙]{1,2})\\s*(${TMON.join("|")})\\s*(?:พ\\.ศ\\.\\s*)?([0-9๐-๙]{4})`,"g");let m;
  while((m=wre.exec(t))){const d=+arab(m[2]),mo=TMON.indexOf(m[3]),y=+arab(m[4])-543;const dt=new Date(y,mo,d);
   if(dt.getMonth()!==mo)res.push({f,lv:"err",w:m[0],fix:null,i:m.index,note:`ไม่มีวันที่ ${m[2]} ${m[3]}`});
   else if(WDAY[dt.getDay()]!==m[1])res.push({f,lv:"err",w:m[0],fix:m[0].replace(m[1]+"ที่",WDAY[dt.getDay()]+"ที่"),i:m.index,note:`วันที่ ${m[2]} ${m[3]} ${m[4]} ตรงกับวัน${WDAY[dt.getDay()]}`});}}
 return res.filter(r=>!res.some(o=>o!==r&&o.f===r.f&&o.i<=r.i&&o.i+o.w.length>=r.i+r.w.length&&o.w.length>r.w.length));}
function spellShow(){const res=spellScan(),L=document.getElementById("spList");L.innerHTML="";
 if(!res.length)L.innerHTML=`<div style="padding:18px;text-align:center;color:#18794e">✓ ไม่พบคำที่มักเขียนผิด<br><small style="color:#6b7684">ระบบตรวจจากรายการคำผิดที่พบบ่อยในหนังสือราชการ และวันในสัปดาห์กับวันที่ · คำที่ไม่อยู่ในรายการให้ดูเส้นใต้สีแดงในช่องกรอก (ตัวตรวจของเบราว์เซอร์ ถ้าเครื่องมีพจนานุกรมไทย)</small></div>`;
 res.forEach(r=>{const t=r.f.get(),a=Math.max(0,r.i-25),b=Math.min(t.length,r.i+r.w.length+25);
  const it=el("div",{class:"it"},`<div><b>${esc(r.f.label)}</b><span class="lv ${r.lv}">${r.lv==="err"?"คำผิด":"ข้อแนะนำ"}</span></div>
   <div style="margin-top:3px"><span class="w">${esc(r.w.replace(/ /g,"␣"))}</span> → ${r.fix!==null?`<span class="r">${esc(r.fix.replace(/ /g,"␣"))}</span>`:"<i>ตรวจแก้เอง</i>"} ${r.note?`<small style="color:#6b7684">(${esc(r.note)})</small>`:""}</div>
   <div class="ctx">…${esc(t.slice(a,r.i))}<u>${esc(r.w)}</u>${esc(t.slice(r.i+r.w.length,b))}…</div>`);
  if(r.fix!==null){const bt=el("button",{type:"button",style:"margin-top:5px"},"แก้");bt.onclick=()=>{const v=r.f.get();if(v.substr(r.i,r.w.length)===r.w){r.f.set(v.slice(0,r.i)+r.fix+v.slice(r.i+r.w.length));save();renderForm();update();}spellShow();};it.appendChild(bt);}
  L.appendChild(it);});
 document.getElementById("spAll").style.display=res.some(r=>r.lv==="err"&&r.fix!==null)?"":"none";
 document.getElementById("spell").style.display="flex";}
document.getElementById("bSpell").onclick=spellShow;
document.getElementById("spClose").onclick=()=>{document.getElementById("spell").style.display="none";};
document.getElementById("spAll").onclick=()=>{for(const r of spellScan().filter(r=>r.lv==="err"&&r.fix!==null).sort((a,b)=>b.i-a.i)){const v=r.f.get();if(v.substr(r.i,r.w.length)===r.w)r.f.set(v.slice(0,r.i)+r.fix+v.slice(r.i+r.w.length));}save();renderForm();update();spellShow();};

const TYPO=[["ปรากฏ","ปรากฎ"],["กฎหมาย","กฏหมาย"],["ปฏิบัติ","ปฎิบัติ"],["อิเล็กทรอนิกส์","อิเล็คทรอนิกส์"],["ประสบภัย","ประสพภัย"],["งบประมาณ","งบประมาน"],["คอมพิวเตอร์","คอมพิวเตอ"],["เหตุการณ์","เหตุการ"],["แต่งตั้ง","เเต่งตั้ง"],["ต่าง ๆ","ต่างๆ"],["ศุกร์ที่ 27","พุธที่ 27"],["พิจารณา","พิจรณา"]];
document.getElementById("bTypo").onclick=()=>{const d=JSON.parse(JSON.stringify(SAMPLE[TYPE]));let n=0;
 const bad=t=>{if(typeof t!=="string")return t;for(const [a,b] of TYPO)if(t.includes(a)){t=t.replace(a,b);n++;}return t;};
 for(const k in d){if(typeof d[k]==="string"&&!["qr","date","font","lsp"].includes(k))d[k]=bad(d[k]);}
 (d.secs||[]).forEach(x=>x.text=bad(x.text));(d.enclList||[]).forEach(x=>x.text=bad(x.text));(d.refList||[]).forEach(x=>{if(x.free)x.free=bad(x.free);});
 if(d.body!==undefined)d.body=(d.body||"")+(d.body?"\nเพื่อให้การดำเนินงานต่างๆ เป็นไปด้วยความเรียบร้อย":"");
 D=Object.assign(defaults(),d);save();renderForm();update();spellShow();};

 // วาง "เดือนและปี" ไว้บรรทัดเดียวกับ "ที่" ให้ฟอร์มกระชับ

 requestAnimationFrame(fitTA);document.getElementById("form").scrollTop=_st;};
